name: Verificar recetas Police Cuffs en servidor

on:
  push:
    paths:
      - 'src/main/resources/data/policecuffs/**'
      - 'src/main/java/com/whea7l3y/policecuffs/**'
      - '.github/workflows/verificar-recetas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Arrancar servidor y comprobar recetas
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar entorno del servidor de prueba
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Comprobar las recetas con el servidor real de Minecraft
        run: |
          set +e
          timeout 220s bash ./gradlew runServer --no-daemon > recipe-test.log 2>&1
          code=$?
          set -e
          echo "Salida del servidor (codigo $code):"
          tail -n 120 recipe-test.log
          if grep -q 'Comprobacion de recetas Police Cuffs: handcuffs=OK, handcuffs_flexible=OK' recipe-test.log; then
            echo 'El servidor ha cargado las DOS recetas correctamente.'
          else
            echo 'ERROR: no se ha comprobado la carga de recetas del servidor.'
            exit 1
          fi
      - name: Conservar el registro de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-prueba-recetas
          path: recipe-test.log
          if-no-files-found: ignore
