name: Verificar recetas Police Cuffs en servidor

on:
  push:
    paths:
      - 'src/main/resources/data/policecuffs/**'
      - 'src/main/java/com/whea7l3y/policecuffs/**'
      - '.github/workflows/verificar-recetas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Arrancar servidor y comprobar recetas
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar entorno del servidor de prueba
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Comprobar las recetas con el servidor real de Minecraft
        run: |
          set -eu
          timeout 180s bash ./gradlew runServer --no-daemon > recipe-test.log 2>&1 &
          proceso=$!
          trap 'kill "$proceso" 2>/dev/null || true' EXIT
          for intento in $(seq 1 150); do
            if grep -q 'Comprobacion de recetas Police Cuffs: handcuffs=OK, handcuffs_flexible=OK' recipe-test.log; then
              echo 'El servidor de NeoForge ha cargado las DOS recetas correctamente.'
              tail -n 30 recipe-test.log
              exit 0
            fi
            if grep -q 'Comprobacion de recetas Police Cuffs:' recipe-test.log; then
              echo 'El mod se ha cargado, pero una receta ha fallado.'
              tail -n 120 recipe-test.log
              exit 1
            fi
            if ! kill -0 "$proceso" 2>/dev/null; then
              echo 'El servidor salio antes de verificar las recetas.'
              tail -n 120 recipe-test.log
              exit 1
            fi
            sleep 1
          done
          echo 'No se detecto el arranque del servidor en el plazo de prueba.'
          tail -n 120 recipe-test.log
          exit 1
      - name: Conservar el registro de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-prueba-recetas
          path: recipe-test.log
          if-no-files-found: ignore
