name: Compilar Camera Dispenser Addon

on:
  push:
    branches:
      - camera-dispenser-addon-1.21.11
  workflow_dispatch:

jobs:
  build-camera-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source
        run: |
          base64 -d camera-dispenser-addon-sources.tar.xz.base64 | tar -xJf -
          test -f camera-dispenser-addon/build.gradle
          sed -i "s/localRuntime 'curse.maven:/runtimeOnly 'curse.maven:/" camera-dispenser-addon/build.gradle
          sed -i '/configurations { runtimeClasspath.extendsFrom(localRuntime) }/d' camera-dispenser-addon/build.gradle
          PKG=camera-dispenser-addon/src/main/java/com/whea7l3y/cameradispenser
          sed -i 's/import net.minecraft.core.BlockSource;/import net.minecraft.core.dispenser.BlockSource;/' "$PKG/CameraDispenserAddon.java"
          sed -i 's/import net.neoforged.neoforge.network.PacketDistributor;/import net.neoforged.neoforge.client.network.ClientPacketDistributor;/' "$PKG/ClientCapture.java"
          sed -i 's/PacketDistributor.sendToServer(/ClientPacketDistributor.sendToServer(/' "$PKG/ClientCapture.java"
          sed -i 's/registrar.playToClient(CaptureRequest.TYPE, CaptureRequest.STREAM_CODEC);/registrar.playToClient(CaptureRequest.TYPE, CaptureRequest.STREAM_CODEC, (request, context) -> ClientCapture.onCaptureRequest(request, context));/' "$PKG/CameraNetwork.java"
          rm "$PKG/ClientCaptureRegistration.java"
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Minecraft addon
        run: ./gradlew -p camera-dispenser-addon build --stacktrace --no-configuration-cache
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Dispenser-Addon-1.21.11
          path: camera-dispenser-addon/build/libs/*.jar
